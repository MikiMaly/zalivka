# Vydání verze: GitHub → Releases → Draft a new release → tag vX.Y.Z → Publish.
# Workflow pak k vydání přibalí sestavený soubor zalivka.html ke stažení.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html zalivka.html
      - run: gh release upload "${{ github.event.release.tag_name }}" zalivka.html --clobber
        env:
          GH_TOKEN: ${{ github.token }}
